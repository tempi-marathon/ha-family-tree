name: Release

on:
  release:
    types: [created]

permissions: {}

env:
  COMPONENT_DIR: custom_components/family_tree
  ZIP_NAME: family_tree.zip

jobs:
  release:
    name: Build release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Stamp manifest version from release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          path = Path(os.environ["COMPONENT_DIR"]) / "manifest.json"
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = version
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"manifest version set to {version}")
          PY

      - name: ZIP the integration directory
        run: |
          cd "${COMPONENT_DIR}"
          zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" . \
            -x '*__pycache__*' \
            -x '*.pyc' \
            -x '.DS_Store'

      - name: Upload the ZIP file to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" "${ZIP_NAME}" --clobber --repo "${GITHUB_REPOSITORY}"
