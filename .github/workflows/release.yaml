name: Release

# Prefer: save a draft release, then run this workflow (workflow_dispatch) or wait
# for release:created. Publish only after family_tree.zip is attached.
# release:published is a fallback when the zip was not built on draft create
# (API-created drafts often skip the created event).
on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the zip to (e.g. v0.5.3)"
        required: true
        type: string

permissions: {}

env:
  COMPONENT_DIR: custom_components/family_tree
  ZIP_NAME: family_tree.zip

jobs:
  release:
    name: Build release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          # Draft releases often have no git tag yet; use the release target or main.
          ref: ${{ github.event.release.target_commitish || 'main' }}

      - name: Resolve release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "No release tag available" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Stamp manifest version from release tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          path = Path(os.environ["COMPONENT_DIR"]) / "manifest.json"
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = version
          path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"manifest version set to {version}")
          PY

      - name: ZIP the integration directory
        run: |
          cd "${COMPONENT_DIR}"
          zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" . \
            -x '*__pycache__*' \
            -x '*.pyc' \
            -x '.DS_Store'

      - name: Upload the ZIP file to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "${TAG}" "${ZIP_NAME}" --clobber --repo "${GITHUB_REPOSITORY}"
