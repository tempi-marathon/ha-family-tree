add_person:
  name: Add person
  description: Add a person to the family tree.
  fields:
    config_entry_id:
      name: Config entry
      description: Family Tree entry (optional while only one exists)
      selector:
        config_entry:
          integration: family_tree
    given_names:
      name: First name(s)
      example: Anna Maria
      required: true
      selector:
        text:
    call_name:
      name: Preferred name
      example: Anna
      selector:
        text:
    surname_prefix:
      name: Surname prefix
      example: van
      selector:
        text:
    surname:
      name: Last name
      example: Berg
      selector:
        text:
    sex:
      name: Gender
      default: unknown
      selector:
        select:
          options:
            - male
            - female
            - intersex
            - unknown
    is_living:
      name: Alive
      default: true
      selector:
        boolean:
    notes:
      name: Notes
      selector:
        text:

link_user:
  name: Link Home Assistant user
  description: Link a Home Assistant user to a person for lineage indicators.
  fields:
    config_entry_id:
      name: Config entry
      selector:
        config_entry:
          integration: family_tree
    ha_user_id:
      name: Home Assistant user id
      required: true
      selector:
        text:
    person_id:
      name: Person id
      required: true
      selector:
        text:

export_gedcom:
  name: Export GEDCOM
  description: Export the family tree as GEDCOM 5.5.1 text (any authenticated user or automation).
  fields:
    config_entry_id:
      name: Config entry
      selector:
        config_entry:
          integration: family_tree
